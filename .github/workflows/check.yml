name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung step fails within the hour, not at GitHub's six.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The v1 tag is frozen and no longer moves.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - run: vp check
      - run: vp run check:tokens
      - run: vp test run
      - run: |
          cp .dev.vars.example .dev.vars
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" .dev.vars
          sed -i "s|^PAYMENTS_WEBHOOK_SECRET=.*|PAYMENTS_WEBHOOK_SECRET=$(openssl rand -base64 32)|" .dev.vars
      # Playwright's own server on Linux never exits, so the step would hang.
      - run: |
          vp run db:migrate:local
          nohup vp dev > dev-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000 && exit 0; sleep 2; done
          cat dev-server.log
          exit 1
      - run: vp run test:smoke
        timeout-minutes: 15
